resource:
    name: ProductReviews
    shortName: product-reviews
    description: 'Storefront product reviews'

    provider: Spryker\Glue\ProductReviewsRestApi\Api\Storefront\Provider\ProductReviewsStorefrontProvider
    processor: Spryker\Glue\ProductReviewsRestApi\Api\Storefront\Processor\ProductReviewsStorefrontProcessor

    paginationEnabled: true
    paginationClientEnabled: true
    paginationItemsPerPage: 10
    paginationMaximumItemsPerPage: 100

    operations:
        - type: GetCollection
          name: getProductReviewsByAbstractProductSku
          uriTemplate: /abstract-products/{abstractProductSku}/product-reviews
          description: 'Retrieve reviews for an abstract product'
          uriVariables:
              abstractProductSku:
                  identifiers: [abstractProductSku]
          openapiContext:
              summary: 'Retrieve the reviews of an abstract product'
              responses:
                  200:
                      description: 'Product reviews returned.'
                  404:
                      description: 'Abstract product not found.'

        - type: Get
          uriTemplate: /abstract-products/{abstractProductSku}/product-reviews/{idProductReview}
          description: 'Retrieve a single review for an abstract product'
          uriVariables:
              abstractProductSku:
                  identifiers: [abstractProductSku]
              idProductReview:
                  identifiers: [idProductReview]
          openapiContext:
              summary: 'Retrieve a product review'
              responses:
                  200:
                      description: 'Product review returned.'
                  404:
                      description: 'Abstract product or review not found.'

        - type: Post
          uriTemplate: /abstract-products/{abstractProductSku}/product-reviews
          security: "is_granted('ROLE_CUSTOMER')"
          status: 202
          description: 'Submit a new review for an abstract product (authenticated customer).'
          uriVariables:
              abstractProductSku:
                  identifiers: [abstractProductSku]
          openapiContext:
              summary: 'Create a product review'
              responses:
                  202:
                      description: 'Review accepted for moderation.'
                  401:
                      description: 'Invalid access token.'
                  403:
                      description: 'Missing access token.'
                  404:
                      description: 'Abstract product not found.'
                  422:
                      description: 'Validation failed.'

    properties:
        idProductReview:
            type: string
            identifier: true
            writable: false
            readable: true
            description: 'Product review identifier'
            openapiContext:
                example: '1'

        abstractProductSku:
            type: string
            writable: false
            readable: true
            required: false
            description: 'Parent abstract product SKU.'
            openapiContext:
                example: '001'

        rating:
            type: integer
            writable: true
            readable: true
            required: true
            description: 'Rating given in the review'
            openapiContext:
                example: 5

        nickname:
            type: string
            writable: true
            readable: true
            required: true
            description: 'Reviewer nickname'
            openapiContext:
                example: 'Spencer'

        summary:
            type: string
            writable: true
            readable: true
            required: true
            description: 'Review summary'
            openapiContext:
                example: 'Great camera!'

        description:
            type: string
            writable: true
            readable: true
            required: false
            description: 'Full review text'
            openapiContext:
                example: 'This camera has been perfect for my needs. Image quality is excellent, the controls are intuitive, and the battery life is better than expected.'

        pagination:
            type: object
            objectName: Pagination
            writable: false
            readable: true
            required: false
            description: 'Pagination metadata for the collection. Populated only on the first item of a GET /abstract-products/{sku}/product-reviews response; consumed by PaginationLinksResponseSubscriber to emit JSON:API top-level pagination links (first/last/prev/next).'
            properties:
                numFound:
                    type: integer
                    description: 'Total number of items found.'
                    openapiContext:
                        example: 4
                currentPage:
                    type: integer
                    description: 'Current page number.'
                    openapiContext:
                        example: 1
                maxPage:
                    type: integer
                    description: 'Total number of pages.'
                    openapiContext:
                        example: 4
                currentItemsPerPage:
                    type: integer
                    description: 'Number of items per page.'
                    openapiContext:
                        example: 1
